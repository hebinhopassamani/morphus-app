<div class="sticky top-0 z-99 flex items-center gap-x-2 border-b bg-white py-3 ps-4 pe-5 dark:bg-neutral-2">
  <button matIconButton (click)="menuToggle.emit()">
    <mat-icon svgIcon="panel-left" />
  </button>
  <div class="flex-auto"></div>
  <button matIconButton (click)="toggleScheme()">
    <mat-icon [svgIcon]="isDark() ? 'sun' : 'moon'" />
  </button>
</div>
