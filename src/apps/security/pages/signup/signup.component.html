<mat-card
  appearance="filled"
  class="w-full max-w-sm [--card-border-radius:var(--radius-2xl)] [--card-surface-padding:--spacing(8)] sm:[--card-surface-padding:--spacing(10)]">
  <mat-card-content class="flex flex-col items-center">
    <mat-icon class="size-6 text-neutral-12" svgIcon="command" />
    <div class="mt-8 text-4xl font-semibold">Cadastro</div>
    <p class="mt-4 text-center text-neutral-11">Crie sua conta para começar.</p>

    <button class="primary large mt-8 w-full" matButton type="button" [disabled]="auth.isLoading()" (click)="auth.signup()">
      <mat-icon svgIcon="user-plus" />
      Criar conta
    </button>

    <a class="link mt-8 text-primary-a11 decoration-primary-a11" matButton routerLink="/security/signin">Voltar para login</a>
  </mat-card-content>
</mat-card>
