<mat-card
  appearance="filled"
  class="w-full max-w-sm [--card-border-radius:var(--radius-2xl)] [--card-surface-padding:--spacing(8)] sm:[--card-surface-padding:--spacing(10)]">
  <mat-card-content class="flex flex-col items-center">
    <mat-icon class="size-6 text-neutral-12" svgIcon="command" />
    <div class="mt-8 text-4xl font-semibold">Login</div>
    <p class="mt-4 text-center text-neutral-11">Acesse sua conta para continuar.</p>

    @if (auth.error(); as error) {
      <div class="mt-4 w-full rounded-lg bg-error-a3 p-3 text-sm text-error-a11">Não foi possível entrar: {{ error.message }}</div>
    }

    <button class="primary large mt-8 w-full" matButton type="button" [disabled]="auth.isLoading()" (click)="auth.login()">
      <mat-icon svgIcon="log-in" />
      Entrar
    </button>

    <a class="link mt-8 text-primary-a11 decoration-primary-a11" matButton href="" (click)="$event.preventDefault(); auth.signup()">Efetuar o cadastro</a>
  </mat-card-content>
</mat-card>
