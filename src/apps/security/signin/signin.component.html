<mat-card
  appearance="filled"
  class="w-full max-w-sm [--card-border-radius:var(--radius-2xl)] [--card-surface-padding:--spacing(8)] sm:[--card-surface-padding:--spacing(10)]">
  <mat-card-content class="flex flex-col items-center">
    <mat-icon class="size-6 text-neutral-12" svgIcon="command" />
    <div class="mt-8 text-4xl font-semibold">Login</div>

    <form class="mt-8 flex w-full flex-col" [formRoot]="signinForm">
      <div class="flex flex-col gap-y-4">
        <mat-form-field class="w-full">
          <mat-label>email</mat-label>
          <input type="email" matInput [formField]="signinForm.email" />
          <mat-error>
            @for (error of signinForm.email().errors(); track error) {
              {{ error.message }}
            }
          </mat-error>
        </mat-form-field>

        <mat-form-field class="w-full">
          <mat-label>senha</mat-label>
          <input type="password" matInput [formField]="signinForm.password" />
          <mat-error>
            @for (error of signinForm.password().errors(); track error) {
              {{ error.message }}
            }
          </mat-error>
        </mat-form-field>
      </div>

      <div class="mt-4 flex items-center justify-between">
        <mat-checkbox [checked]="signinModel().savePassword" (change)="setSavePassword($event.checked)">Salvar a senha</mat-checkbox>
        <a class="link text-primary-a11 decoration-primary-a11" matButton href="" (click)="$event.preventDefault()">Esqueceu a senha</a>
      </div>

      <button class="primary large mt-8 w-full" matButton type="submit">Login</button>
    </form>

    <a class="link mt-8 text-primary-a11 decoration-primary-a11" matButton routerLink="/security/signup">Efetuar o cadastro</a>
  </mat-card-content>
</mat-card>
