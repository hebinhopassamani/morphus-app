services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NG_ALLOWED_HOSTS: ${DOMAIN:?Defina DOMAIN no arquivo .env}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
